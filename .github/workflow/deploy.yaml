name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker buildx build -t ${{ secrets.DOCKERHUB_USERNAME }}/personal-website:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/personal-website:latest

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/personal-website:latest
          docker stop personal-website || true
          docker rm personal-website || true
          docker run -d --name personal-website -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/personal-website:latest